<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Bootstrap | Dazzling Academic CRM</title>
  <style>
    :root {
      --primary: #2563eb;
      --error: #dc2626;
      --success: #16a34a;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      width: 100%;
      max-width: 450px;
      padding: 20px;
    }

    .card {
      background: var(--card);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
      text-align: center;
      color: var(--primary);
    }

    p.subtitle {
      text-align: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }

    .error { background-color: #fee2e2; color: var(--error); border: 1px solid #fecaca; }
    .success { background-color: #dcfce7; color: var(--success); border: 1px solid #bbf7d0; }

    .loader {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>Initialize System</h1>
    <p class="subtitle">Setup your primary administrator account.</p>

    <form id="setupForm">
      <div class="form-group">
        <label for="setupKey">Setup Key</label>
        <input type="password" id="setupKey" required placeholder="Enter the secret setup key">
      </div>

      <div class="form-group">
        <label for="username">Admin Username</label>
        <input type="text" id="username" required placeholder="e.g. admin_main">
      </div>

      <div class="form-group">
        <label for="email">Admin Email</label>
        <input type="email" id="email" required placeholder="e.g. admin@school.com">
      </div>

      <div class="form-group">
        <label for="password">Admin Password</label>
        <input type="password" id="password" required minlength="8" placeholder="At least 8 characters">
      </div>

      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" required placeholder="e.g. John Doe">
      </div>

      <button type="submit" id="submitBtn">Create Admin Account</button>
    </form>

    <div id="message"></div>
  </div>
</div>

<script>
  const form = document.getElementById('setupForm');
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('message');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    
    // UI State
    btn.disabled = true;
    btn.innerHTML = '<span class="loader"></span> Processing...';
    msg.style.display = 'none';

    const request = {
      action: "bootstrap_admin",
      setupKey: document.getElementById('setupKey').value,
      userData: {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      },
      profileData: {
        name: document.getElementById('name').value,
        designation: "System Owner"
      }
    };

    // Call GAS server
    google.script.run
      .withSuccessHandler(function(response) {
        if (response.success) {
          showMsg("✅ Success! Admin account created. This page is now disabled.", "success");
          form.reset();
        } else {
          showMsg("❌ " + (response.error.message || "Setup failed."), "error");
          btn.disabled = false;
          btn.innerHTML = 'Create Admin Account';
        }
      })
      .withFailureHandler(function(err) {
        showMsg("💥 Server Error: " + err.message, "error");
        btn.disabled = false;
        btn.innerHTML = 'Create Admin Account';
      })
      .executeActionViaUI(request); 
  });

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = type;
    msg.style.display = 'block';
  }
</script>

</body>
</html>
