<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Entity Registration | Dazzling CRM</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #334155;
      --border: #e2e8f0;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
    
    .page-layout { display: grid; grid-template-columns: 350px 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; align-items: start; }
    
    .card { background: var(--card); border-radius: 12px; padding: 25px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    
    h1 { font-size: 20px; margin-top: 0; color: #1e293b; text-align: center; }
    h2 { font-size: 16px; margin-top: 0; margin-bottom: 20px; color: #1e293b; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    
    .token-box { background: #fffbeb; border: 1px solid #fef3c7; padding: 15px; border-radius: 8px; margin-bottom: 25px; }
    .token-box label { display: block; font-size: 12px; font-weight: bold; color: #92400e; margin-bottom: 5px; }
    .token-box input { width: 100%; border: 1px solid #fde68a; padding: 8px; border-radius: 4px; box-sizing: border-box; font-family: monospace; font-size: 12px; }

    .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 25px; }
    .tab { padding: 10px 20px; cursor: pointer; font-weight: 600; color: #64748b; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    .form-section { display: none; }
    .form-section.active { display: block; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-group { margin-bottom: 15px; }
    .form-group.full { grid-column: span 2; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #475569; }
    input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    
    .section-title { font-size: 12px; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.05em; margin: 20px 0 10px 0; border-bottom: 1px solid #f1f5f9; padding-bottom: 5px; }

    button.btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    button.primary { background: var(--primary); color: white; }
    button.primary:hover { background: #1d4ed8; }
    button.secondary { background: #64748b; color: white; }
    button.secondary:hover { background: #475569; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #message { margin-top: 20px; padding: 12px; border-radius: 6px; font-size: 14px; display: none; line-height: 1.5; }
    #loginMessage { margin-top: 15px; font-size: 13px; display: none; padding: 10px; border-radius: 6px; }
    
    .error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>

<div class="page-layout">
  
  <!-- Left Panel: Login (Dev Environment) -->
  <div class="card">
    <h2>Dev Login Panel</h2>
    <p style="font-size: 12px; color: #64748b; margin-bottom: 20px;">Use this to quickly get an admin token for testing registration.</p>
    
    <form id="devLoginForm">
      <div class="form-group">
        <label>Admin Username</label>
        <input type="text" id="loginUser" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" required>
      </div>
      <button type="submit" id="loginBtn" class="btn secondary">Login & Fetch Token</button>
    </form>
    <div id="loginMessage"></div>
  </div>

  <!-- Right Panel: Registration -->
  <div class="card">
    <h1>Entity Registration</h1>

    <div class="token-box">
      <label>ACTIVE SESSION TOKEN</label>
      <input type="text" id="adminToken" placeholder="Will be auto-filled after login or paste manually...">
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('student')">Student</div>
      <div class="tab" onclick="switchTab('teacher')">Teacher</div>
    </div>

    <!-- Student Form -->
    <div id="studentSection" class="form-section active">
      <form id="studentForm">
        <div class="section-title">User Account</div>
        <div class="grid">
          <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required minlength="6">
          </div>
          <div class="form-group full">
            <label>Email</label>
            <input type="email" name="email" required>
          </div>
        </div>

        <div class="section-title">Student Profile</div>
        <div class="grid">
          <div class="form-group full">
            <label>Full Name</label>
            <input type="text" name="name" required>
          </div>
          <div class="form-group">
            <label>Enrollment No.</label>
            <input type="text" name="enrollment_no" required>
          </div>
          <div class="form-group">
            <label>Grade / Class</label>
            <input type="text" name="grade" required>
          </div>
        </div>
        <button type="submit" class="btn primary">Register Student</button>
      </form>
    </div>

    <!-- Teacher Form -->
    <div id="teacherSection" class="form-section">
      <form id="teacherForm">
        <div class="section-title">User Account</div>
        <div class="grid">
          <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required minlength="6">
          </div>
          <div class="form-group full">
            <label>Email</label>
            <input type="email" name="email" required>
          </div>
        </div>

        <div class="section-title">Teacher Profile</div>
        <div class="grid">
          <div class="form-group full">
            <label>Full Name</label>
            <input type="text" name="name" required>
          </div>
          <div class="form-group">
            <label>Subject Code</label>
            <input type="text" name="subject_code" required>
          </div>
          <div class="form-group">
            <label>Designation</label>
            <input type="text" name="designation" placeholder="e.g. Senior Lecturer">
          </div>
        </div>
        <button type="submit" class="btn primary">Register Teacher</button>
      </form>
    </div>

    <div id="message"></div>
  </div>
</div>

<script>
  let currentEntity = 'student';

  // --- Login Logic ---
  document.getElementById('devLoginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const msg = document.getElementById('loginMessage');
    
    btn.disabled = true;
    btn.textContent = "Logging in...";
    msg.style.display = 'none';

    const payload = {
      action: "login",
      username: document.getElementById('loginUser').value,
      password: document.getElementById('loginPass').value
    };

    google.script.run
      .withSuccessHandler(res => {
        console.log("[DevLogin] Raw Response:");
        console.log(res);
        btn.disabled = false;
        btn.textContent = "Login & Fetch Token";
        if (res.success) {
          // Alignment Fix: Access via res.data.token and res.data.user.username
          document.getElementById('adminToken').value = res.data.token;
          msg.textContent = "✅ Logged in as " + res.data.user.username;
          msg.className = "success";
          msg.style.display = "block";
        } else {
          msg.textContent = "❌ " + res.error.message;
          msg.className = "error";
          msg.style.display = "block";
        }
      })
      .withFailureHandler(err => {
        console.error("[DevLogin] Critical Error:", err);
        btn.disabled = false;
        btn.textContent = "Login & Fetch Token";
        msg.textContent = "💥 Server error: " + err.message;
        msg.className = "error";
        msg.style.display = "block";
      })
      .executeActionViaUI(payload);
  });

  // --- Tab Switching ---
  function switchTab(entity) {
    currentEntity = entity;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
    
    event.currentTarget.classList.add('active');
    document.getElementById(entity + 'Section').classList.add('active');
    hideMsg();
  }

  // --- Registration Logic ---
  function handleForm(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    const token = document.getElementById('adminToken').value;
    
    if (!token) {
      showMsg("❌ Please provide an Admin Session Token.", "error");
      return;
    }

    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());

    const payload = {
      action: "add" + currentEntity,
      token: token,
      userData: {
        username: data.username,
        password: data.password,
        email: data.email
      },
      profileData: { ...data }
    };
    
    delete payload.profileData.username;
    delete payload.profileData.password;
    delete payload.profileData.email;

    btn.disabled = true;
    btn.textContent = "Processing...";
    hideMsg();

    google.script.run
      .withSuccessHandler((res) => {
        btn.disabled = false;
        btn.textContent = "Register " + currentEntity.charAt(0).toUpperCase() + currentEntity.slice(1);
        console.log(`[${currentEntity} Registration] Raw Response:`);
        console.log(res);
        if (res.success) {  
          
          const feedback = res.message || `✅ Success! Created ${currentEntity}: ${res.data.user.username}`;
          showMsg(feedback, "success");
          e.target.reset();
        } else {
          showMsg(`❌ Error: ${res.error.message}`, "error");
        }
      })
      .withFailureHandler((err) => {
        btn.disabled = false;
        btn.textContent = "Register " + currentEntity;
        showMsg(`💥 Critical Failure: ${err.message}`, "error");
      })
      .executeActionViaUI(payload);
  }

  document.getElementById('studentForm').addEventListener('submit', handleForm);
  document.getElementById('teacherForm').addEventListener('submit', handleForm);

  function showMsg(text, type) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.className = type;
    msg.style.display = 'block';
  }

  function hideMsg() {
    document.getElementById('message').style.display = 'none';
  }
</script>

</body>
</html>
