<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Session Inspector | Dazzling CRM</title>
  <style>
    body { font-family: sans-serif; background: #f1f5f9; color: #334155; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 1000px; margin: 0 auto; }
    h1 { color: #1e293b; font-size: 20px; margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; table-layout: fixed; }
    th { text-align: left; background: #f8fafc; padding: 12px; border-bottom: 2px solid #e2e8f0; font-size: 13px; text-transform: uppercase; }
    td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-family: monospace; font-size: 12px; word-break: break-all; }
    .status-alive { color: #16a34a; font-weight: bold; }
    .status-dead { color: #dc2626; font-weight: bold; }
    .refresh-btn { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; float: right; }
    .refresh-btn:hover { background: #1d4ed8; }
    .token-cell { color: #1e293b; font-weight: 600; background: #f8fafc; padding: 5px; border-radius: 4px; display: block; border: 1px solid #e2e8f0; }
    .copy-btn { margin-top: 5px; padding: 2px 8px; font-size: 10px; cursor: pointer; background: #e2e8f0; border: none; border-radius: 3px; }
  </style>
</head>
<body>

<div class="card">
  <button class="refresh-btn" onclick="loadSessions()">Refresh List</button>
  <h1>Live Session Registry</h1>
  
  <p style="font-size: 12px; color: #64748b;">This page shows all tokens tracked in ScriptProperties. "Is Alive" checks if the token still exists in Google Cache.</p>

  <table>
    <thead>
      <tr>
        <th style="width: 200px;">User ID</th>
        <th>Full Token (Triple-click to select)</th>
        <th style="width: 100px;">Is Alive?</th>
        <th style="width: 100px;">Actions</th>
      </tr>
    </thead>
    <tbody id="sessionTable">
      <tr><td colspan="4" style="text-align:center;">Loading sessions...</td></tr>
    </tbody>
  </table>
</div>

<script>
  function loadSessions() {
    const tbody = document.getElementById('sessionTable');
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Scanning Cache...</td></tr>';

    google.script.run
      .withSuccessHandler(renderSessions)
      .getSessionsForUI();
  }

  function renderSessions(sessions) {
    const tbody = document.getElementById('sessionTable');
    if (!sessions || sessions.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No active sessions found.</td></tr>';
      return;
    }

    tbody.innerHTML = sessions.map(s => `
      <tr>
        <td>${s.userId}</td>
        <td><code class="token-cell">${s.token}</code></td>
        <td class="${s.isAlive ? 'status-alive' : 'status-dead'}">${s.isAlive ? 'YES' : 'EXPIRED'}</td>
        <td>
          <button onclick="killSession('${s.token}')" style="color:red; cursor:pointer; background:none; border:1px solid red; border-radius:3px; font-size:10px;">Destroy</button>
        </td>
      </tr>
    `).join('');
  }

  function killSession(token) {
    if(!confirm("Destroy this session?")) return;
    google.script.run.withSuccessHandler(loadSessions).destroySessionFromUI(token);
  }

  // Initial Load
  window.onload = loadSessions;
</script>

</body>
</html>
